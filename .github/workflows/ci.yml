name: VedBus Backend CI/CD

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Build & Run Automated Test Suite
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/vedbus_test?schema=public' }}
      JWT_ACCESS_SECRET: yatrabus_dev_access_secret_key_super_secure_random_123456789
      JWT_REFRESH_SECRET: yatrabus_dev_refresh_secret_key_super_secure_random_987654321
      JWT_ACCESS_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 5000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: BACKEND/package-lock.json

      - name: Install Dependencies
        working-directory: BACKEND
        run: npm ci

      - name: Generate Prisma Client
        working-directory: BACKEND
        run: npx prisma generate

      - name: Check TypeScript Compilation
        working-directory: BACKEND
        run: npx tsc --noEmit

      - name: Run Jest Test Suite (CI Mode)
        working-directory: BACKEND
        run: npm run test:ci

      - name: Upload Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: BACKEND/coverage/
